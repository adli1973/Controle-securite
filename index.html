.chip.add{color:var(--ac);border-style:dashed}

.x{background:none;border:0;color:var(--mu);font-size:20px;cursor:pointer}

</style></head><body><main>

</div>
<div id="gate"><div class="gbox"><h1>Contrôle sécurité</h1><p>Entrez votre code d’accès</p><input id="gcode" type="text" inputmode="text" autocapitalize="characters" maxlength="4" autocomplete="off"><button class="b p" id="gok">Entrer</button><p id="gerr"></p></div></div>
<div id="rep" hidden></div>
<input type="file" id="phFile" accept="image/*" hidden>
<div id="toast"></div>
</main>

var G=[

points:PO.slice(),customAnomalies:{},

S.noFloorAnomalies=S.noFloorAnomalies||{};

  });

var REN={"Ascenseur":"Ascenseurs","Porte d’entrée":"Portes d’entrée immeubles","Skylux":"Skydome","Hall et couloir":"Hall, palier et escalier","Hall, couloir et escalier":"Hall, palier et escalier","Échelle d’accès au toit":"Trappe d’accès à la toiture"};

S.pointCatalogOrder=uniquePoints(S.pointCatalogOrder);

["customAnomalies","removedAnomalies","floorAnomalies","noFloorAnomalies"].forEach(function(field){var source=S[field]||{};Object.keys(REN).forEach(function(old){if(source[old]!==undefined){var target=REN[old];source[target]=Array.isArray(source[target])?source[target].concat(source[old].filter(function(x){return source[target].indexOf(x)<0})):source[old];delete source[old]}});S[field]=source});
["Colonnes sèches","Encombrants","Trappe d’accès à la toiture","BAES","Hall, palier et escalier","Électricité","Façade d’immeuble","Porte coupe-feu"].forEach(function(p){if(S.points.indexOf(p)<0)S.points.push(p)});

S.adresses.forEach(function(a){var l=a.an&&a.an["Trappe d’accès à la toiture"];if(l)a.an["Trappe d’accès à la toiture"]=l.map(function(o){return o==="Cadenas manquant"?"Cadenas cassé ou absent":o})});

  S.pointCatalogOrder=(S.pointCatalogOrder||[]).filter(function(p){return names.indexOf(String(p).trim())<0;});
  (S.adresses||[]).forEach(stripAddress);
  (S.history||[]).forEach(function(h){h.points=(h.points||[]).filter(function(p){return names.indexOf(String(p).trim())<0;});(h.adresses||[]).forEach(stripAddress);});

// Nettoyage unique de l’anomalie automatique « Porte de… » sur le point Cave.
// Cave reste un point personnalisable : aucune anomalie n’est préremplie et
// l’utilisateur pourra ensuite ajouter manuellement les anomalies de son choix.
(function(){
  var cleanupKey="controle-securite-cave-porte-default-retire-v1";
  if(localStorage.getItem(cleanupKey)==="1")return;
  function isCave(name){return String(name||"").trim().toLocaleLowerCase("fr")==="cave";}
  function isAutoPorte(name){return /^porte\s+de\b/i.test(String(name||"").trim());}
  [S.customAnomalies,S.removedAnomalies,S.floorAnomalies,S.noFloorAnomalies].forEach(function(group){
    Object.keys(group||{}).forEach(function(point){
      if(isCave(point)&&Array.isArray(group[point]))group[point]=group[point].filter(function(name){return !isAutoPorte(name);});
    });
  });
  (S.adresses||[]).forEach(function(address){
    ["an","et","su","ss","ph"].forEach(function(field){
      var group=address[field];
      if(!group)return;
      Object.keys(group).forEach(function(point){
        if(!isCave(point))return;
        if(field==="an"&&Array.isArray(group[point]))group[point]=group[point].filter(function(name){return !isAutoPorte(name);});
        else if(group[point]&&typeof group[point]==="object"){
          Object.keys(group[point]).forEach(function(anomaly){if(isAutoPorte(anomaly))delete group[point][anomaly];});
        }
      });
    });
  });
  try{
    localStorage.setItem(KEY,JSON.stringify(S));
    var cfg=JSON.parse(localStorage.getItem(MANAGER_CONFIG_KEY)||"null");
    if(cfg){["customAnomalies","removedAnomalies","floorAnomalies","noFloorAnomalies"].forEach(function(field){var group=cfg[field]||{};Object.keys(group).forEach(function(point){if(isCave(point)&&Array.isArray(group[point]))group[point]=group[point].filter(function(name){return !isAutoPorte(name);});});cfg[field]=group;});localStorage.setItem(MANAGER_CONFIG_KEY,JSON.stringify(cfg));}
    localStorage.setItem(cleanupKey,"1");
  }catch(e){}
})();

function repText(){
  var t="CONTRÔLE SÉCURITÉ – Secteur "+S.secteur+"\nGardien : "+(S.gardien||"—")+"\nDate : "+S.date.split("-").reverse().join("/")+"\n";
  S.adresses.forEach(function(a){
    if(S.gardien&&a.g!==S.gardien)return;t+="\n"+a.nom+"\n";
    orderedPoints().forEach(function(p){if((p==="Ascenseurs"||p==="BAES"||p==="Colonnes sèches"||p==="Porte coupe-feu")&&!a.asc)return;var v=ev(a,p),exl="",an=(a.an&&a.an[p]&&v==="ko")?a.an[p].map(function(l){var f=a.et&&a.et[p]&&a.et[p][l];return sublab(a,p,l)+(f?" (étage "+f+")":"")}).join(", "):"";t+="  • "+pointLabel(p)+" : "+LAB[v]+((an||exl)?" ("+[exl,an].filter(Boolean).join(", ")+")":"")+(a.dt&&a.dt[p]?" – dernier entretien : "+a.dt[p].split("-").reverse().join("/"):"")+"\n"});
    if(a.com.trim())t+="  Commentaires : "+a.com.trim().replace(/\n/g," ; ")+"\n";
  });
  return t
}
